name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Lint (ruff)
        run: |
         pip install ruff==0.17.1
          ruff check .

      - name: Syntax check
        run: python -m compileall -q ingestion processing orchestration quality analytics catalog aws

      - name: Validate docker compose file
        working-directory: infrastructure
        run: |
          cp .env.example .env
          docker compose config -q
