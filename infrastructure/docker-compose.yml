x-db-url: &db-url "postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}@ecom_postgres_db:5432/${POSTGRES_DB:-ecom_db}"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: ecom-airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}@ecom_postgres_db:5432/airflow
    DATABASE_URL: *db-url
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__WEBSERVER__SECRET_KEY: ecom-dev-secret-key
  volumes:
    - ../orchestration:/opt/airflow/dags
    - ../processing:/opt/airflow/processing
    - ../ingestion:/opt/airflow/ingestion
    - ../quality:/opt/airflow/quality
    - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecom_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-ecom_db}
    ports:
      - "5432:5432"
    command: postgres -c wal_level=logical
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../ingestion/Init.SQL:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ecom_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ecom_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/29092'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: always

  debezium:
    image: debezium/connect:2.3
    container_name: ecom_debezium
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    restart: always

  
  debezium-setup:
    image: curlimages/curl:8.5.0
    container_name: ecom_debezium_setup
    depends_on:
      - debezium
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
    volumes:
      - ./pg-connector.json:/config/pg-connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://debezium:8083/connectors > /dev/null; do
          echo "waiting for debezium..."; sleep 5;
        done
        sed -e "s/__PG_USER__/$$POSTGRES_USER/" -e "s/__PG_PASSWORD__/$$POSTGRES_PASSWORD/" \
          /config/pg-connector.json > /tmp/connector.json
        curl -s -X POST -H "Content-Type: application/json" \
          --data @/tmp/connector.json http://debezium:8083/connectors
        echo "connector registered"
    restart: "no"

  localstack:
    image: localstack/localstack:3.8
    container_name: ecom_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: always

  
  s3-setup:
    image: amazon/aws-cli:2.15.0
    container_name: ecom_s3_setup
    depends_on:
      - localstack
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url=http://localstack:4566 s3 ls > /dev/null 2>&1; do
          echo "waiting for localstack..."; sleep 3;
        done
        aws --endpoint-url=http://localstack:4566 s3 mb s3://ecom-raw-lake || true
    restart: "no"

  
  data-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecom_data_generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *db-url
    volumes:
      - ../ingestion:/app/ingestion
    command: sh -c "while true; do python /app/ingestion/generate_data.py; sleep 10; done"
    restart: always

  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: ecom_spark_streaming
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      s3-setup:
        condition: service_completed_successfully
    volumes:
      - ../processing:/app/processing
    command: python /app/processing/spark_streaming.py
    restart: on-failure

  airflow-init:
    <<: *airflow-common
    container_name: ecom_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username ${AIRFLOW_ADMIN_USER:-airflow} --password ${AIRFLOW_ADMIN_PASSWORD:?AIRFLOW_ADMIN_PASSWORD is required - see .env.example}
      --firstname Admin --lastname User --role Admin --email admin@example.com || true)"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: ecom_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecom_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    restart: always

volumes:
  postgres_data:
  airflow_logs:
